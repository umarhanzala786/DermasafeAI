{% extends 'base.html' %}
{% block title %}Create Account | Dermasafe AI{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-card"><div class="auth-brand">✚</div><span class="section-kicker">GET STARTED</span><h1>Create your workspace.</h1><p>Set up an account to manage screening records and reports.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="POST"><label>Full name<input type="text" name="username" placeholder="Your full name" autocomplete="name" required></label><label>Email address<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary full" type="submit">Create Account <span>→</span></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
